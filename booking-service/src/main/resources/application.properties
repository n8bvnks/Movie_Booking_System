spring.application.name=booking-service

spring.datasource.url=jdbc:mysql://comp713-s2-2026.c5m2mi6uava2.ap-southeast-2.rds.amazonaws.com:3306/comp713_17988896
spring.datasource.username=c713_17988896
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=2

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=update

server.port=${SERVER_PORT:8082}

movie.service.url=${MOVIE_SERVICE_URL:http://localhost:8083}

management.endpoint.health.show-details=never

# websocket port for live updates
live.ws.port=${LIVE_WS_PORT:8084}

# Embedded ActiveMQ broker (Advanced Path B: message broker). Hosted inside this process with
# a real TCP connector (see messaging/EmbeddedBrokerConfig.java), so notification-service - a
# separately running process - can connect to it remotely, the same as any standalone broker.
activemq.embedded.tcp-port=${ACTIVEMQ_PORT:61616}
spring.activemq.broker-url=tcp://localhost:${ACTIVEMQ_PORT:61616}