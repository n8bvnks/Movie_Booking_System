<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
</head>
<body>
    <!-- who is logged in, with a log out button, filled in by showLoginBar() -->
    <p id="loginBar"></p>

    <h1>Admin</h1>
    <p><a href="index.html">Back to movies</a></p>

    <!-- add a showing: sent to POST /api/v1/admin/showings, booking-service passes it on to movie-service -->
    <h2>Add a showing</h2>
    <form id="showingForm">
        <label for="movieTitle">Movie title</label><br>
        <input type="text" id="movieTitle" required><br><br>

        <label for="genre">Genre</label><br>
        <input type="text" id="genre" required><br><br>

        <label for="description">Description</label><br>
        <input type="text" id="description" required size="50"><br><br>

        <label for="runtime">Runtime (minutes)</label><br>
        <input type="number" id="runtime" min="1" required><br><br>

        <label for="date">Date</label><br>
        <input type="date" id="date" required><br><br>

        <label for="time">Time (like 12pm or 5pm)</label><br>
        <input type="text" id="time" required placeholder="e.g. 3pm"><br><br>

        <label for="seats">Seats</label><br>
        <input type="number" id="seats" min="1" required><br><br>

        <button type="submit">Add showing</button>
    </form>
    <p id="addResult"></p>

    <hr>

    <!-- every showing from movie-service, with a button to see who booked it -->
    <h2>Showings</h2>
    <!-- NEW - connection state of the live updates, and a note when something changes -->
    <p>Live updates: <span id="liveStatus">connecting</span></p>
    <p id="liveMessage"></p>
    <!-- NEW - says what the last delete did -->
    <p id="deleteResult"></p>
    <div id="showings">Loading showings...</div>

    <!-- bookings for the showing the admin clicked on -->
    <h2 id="bookingsHeading"></h2>
    <div id="showingBookings"></div>

    <script src="auth.js"></script>
    <script src="live.js"></script>
    <script>

        // not logged in goes straight to the login page
        requireLogin();
        showLoginBar();

        // customers are sent back to the home page
        // this only hides the page, the server still answers 403 to a customer calling the admin endpoints
        if (getRole() !== "ADMIN") {
            window.location.href = "index.html";
        }

        function formatDate(isoDate) {
            const [year, month, day] = isoDate.split("-");
            const monthNames = ["January", "February", "March", "April", "May", "June",
                                 "July", "August", "September", "October", "November", "December"];
            return parseInt(day) + " " + monthNames[parseInt(month) - 1] + " " + year;
        }

        // sends the form to POST /api/v1/admin/showings
        document.getElementById("showingForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const result = document.getElementById("addResult");
            result.textContent = "Adding showing...";

            // the field names match CreateShowingRequest on the server
            const showing = {
                movieTitle: document.getElementById("movieTitle").value.trim(),
                genre: document.getElementById("genre").value.trim(),
                description: document.getElementById("description").value.trim(),
                runtime: Number(document.getElementById("runtime").value),
                date: document.getElementById("date").value,
                time: document.getElementById("time").value.trim(),
                seats: Number(document.getElementById("seats").value)
            };

            try {
                const response = await authFetch("/api/v1/admin/showings", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(showing)
                });
                const data = await response.json();

                if (response.ok) {
                    result.textContent = "Added " + data.movieTitle + " on " + formatDate(data.date) + " at " + data.time + ".";
                    document.getElementById("showingForm").reset();

                    //NEW - show the new row straight away, the ShowingCreated event for the same showing is then ignored as already applied
                    upsertShowing(data);
                    renderShowings();
                } else {
                    // covers a showing that already exists (409), invalid input (400) and movie-service down (503)
                    result.textContent = "Could not add showing: " + data.message;
                }
            } catch (err) {
                result.textContent = "Something went wrong adding the showing.";
            }
        });

        // NEW - the page keeps the list of showings here, live events change this list and the table is drawn again
        let showings = [];

        // NEW - the showing whose bookings are open below the table, so it can be refreshed when a booking is made
        let selectedShowing = null;

        // NEW - a showing is found by title + date + time, replace it if it is already in the list, otherwise add it
        function upsertShowing(updated) {
            const index = showings.findIndex(s =>
                s.movieTitle === updated.movieTitle && s.date === updated.date && s.time === updated.time);
            if (index >= 0) showings[index] = updated; else showings.push(updated);
        }

        function sameShowing(a, b) {
            return a && b && a.movieTitle === b.movieTitle && a.date === b.date && a.time === b.time;
        }

        // first fill of the table straight from GET /api/v1/movies, so the page still works if the live connection cannot start
        async function loadShowings() {
            const showingsDiv = document.getElementById("showings");

            try {
                const response = await authFetch("/api/v1/movies");
                const data = await response.json();

                if (!response.ok) {
                    showingsDiv.textContent = "Could not load showings: " + data.message;
                    return;
                }

                showings = data;
                renderShowings();

            } catch (err) {
                showingsDiv.textContent = "Could not load showings.";
            }
        }

        // NEW - draws the table from the showings array, called again every time a live event arrives
        function renderShowings() {
            const showingsDiv = document.getElementById("showings");

            if (showings.length === 0) {
                showingsDiv.textContent = "No showings yet.";
                return;
            }

            // textContent is used for the values so a movie title can never be read as html
            const table = document.createElement("table");
            table.border = "1";
            table.cellPadding = "6";

            const header = table.insertRow();
            for (const heading of ["Movie", "Date", "Time", "Seats left", ""]) {
                const cell = document.createElement("th");
                cell.textContent = heading;
                header.appendChild(cell);
            }

            for (const showing of showings) {
                const row = table.insertRow();
                row.insertCell().textContent = showing.movieTitle;
                row.insertCell().textContent = formatDate(showing.date);
                row.insertCell().textContent = showing.time;
                row.insertCell().textContent = showing.seats;

                const button = document.createElement("button");
                button.textContent = "View bookings";
                button.addEventListener("click", () => loadShowingBookings(showing));
                const actions = row.insertCell();
                actions.appendChild(button);

                //NEW - delete just this showing
                const deleteShowingButton = document.createElement("button");
                deleteShowingButton.textContent = "Delete showing";
                deleteShowingButton.addEventListener("click", () => deleteShowing(showing));
                actions.appendChild(deleteShowingButton);

                //NEW - delete every showing of this movie
                const deleteMovieButton = document.createElement("button");
                deleteMovieButton.textContent = "Delete whole movie";
                deleteMovieButton.addEventListener("click", () => deleteMovie(showing.movieTitle));
                actions.appendChild(deleteMovieButton);
            }

            showingsDiv.innerHTML = "";
            showingsDiv.appendChild(table);
        }

        //NEW - takes a deleted showing off the list, nothing happens if it is already gone
        function removeShowing(removed) {
            showings = showings.filter(s => !sameShowing(s, removed));

            //if its bookings were open below the table they are cancelled too, so clear them
            if (sameShowing(selectedShowing, removed)) {
                selectedShowing = null;
                document.getElementById("bookingsHeading").textContent = "";
                document.getElementById("showingBookings").textContent = "";
            }
        }

        //NEW - sends DELETE /api/v1/admin/showings for one showing, after the admin confirms
        //movie-service deletes the showing and booking-service cancels the bookings made for it
        async function deleteShowing(showing) {
            const label = showing.movieTitle + " on " + formatDate(showing.date) + " at " + showing.time;
            if (!confirm("Delete " + label + "? Every booking for it will be cancelled.")) return;

            const params = new URLSearchParams({
                movieTitle: showing.movieTitle,
                date: showing.date,
                time: showing.time
            });
            await sendDelete("/api/v1/admin/showings?" + params, () => removeShowing(showing));
        }

        //NEW - sends DELETE /api/v1/admin/movies for a whole movie, after the admin confirms
        async function deleteMovie(movieTitle) {
            if (!confirm("Delete ALL showings of " + movieTitle + "? Every booking for them will be cancelled.")) return;

            const params = new URLSearchParams({ movieTitle: movieTitle });
            await sendDelete("/api/v1/admin/movies?" + params, () => {
                const gone = showings.filter(s => s.movieTitle === movieTitle);
                gone.forEach(removeShowing);
            });
        }

        //NEW - shared by both deletes, on success the rows come off the table straight away
        //the ShowingDeleted events for the same showings are then ignored as already applied
        async function sendDelete(url, removeFromPage) {
            const result = document.getElementById("deleteResult");
            result.textContent = "Deleting...";

            try {
                const response = await authFetch(url, { method: "DELETE" });
                const data = await response.json();

                if (response.ok) {
                    result.textContent = data.message;
                    removeFromPage();
                    renderShowings();
                } else {
                    // covers no such showing (404), not an admin (403) and movie-service down (503)
                    result.textContent = "Could not delete: " + data.message;
                }
            } catch (err) {
                result.textContent = "Something went wrong deleting.";
            }
        }

        // gets the bookings for one showing from GET /api/v1/admin/showings/bookings
        // a showing has no id, so it is found by title + date + time
        async function loadShowingBookings(showing) {
            const heading = document.getElementById("bookingsHeading");
            const bookingsDiv = document.getElementById("showingBookings");

            //NEW - remember which showing is open, the live updates refresh it when someone books it
            selectedShowing = showing;

            heading.textContent = "Bookings for " + showing.movieTitle + " on " +
                formatDate(showing.date) + " at " + showing.time;
            bookingsDiv.textContent = "Loading...";

            // URLSearchParams takes care of spaces and special characters in the title
            const params = new URLSearchParams({
                movieTitle: showing.movieTitle,
                date: showing.date,
                time: showing.time
            });

            try {
                const response = await authFetch("/api/v1/admin/showings/bookings?" + params);
                const bookings = await response.json();

                if (!response.ok) {
                    bookingsDiv.textContent = "Could not load bookings: " + bookings.message;
                    return;
                }

                if (bookings.length === 0) {
                    bookingsDiv.textContent = "No bookings for this showing yet.";
                    return;
                }

                const table = document.createElement("table");
                table.border = "1";
                table.cellPadding = "6";

                const header = table.insertRow();
                for (const text of ["Booking ID", "Customer", "Seats"]) {
                    const cell = document.createElement("th");
                    cell.textContent = text;
                    header.appendChild(cell);
                }

                for (const booking of bookings) {
                    const row = table.insertRow();
                    row.insertCell().textContent = booking.bookingId;
                    row.insertCell().textContent = booking.name;
                    row.insertCell().textContent = booking.seats;
                }

                bookingsDiv.innerHTML = "";
                bookingsDiv.appendChild(table);

            } catch (err) {
                bookingsDiv.textContent = "Could not load bookings.";
            }
        }

        loadShowings();

        // NEW - live updates, live.js connects to the websocket, fetches a snapshot and then calls these
        startLive({
            // the full current list - on connect and on every reconnect
            onSnapshot: function (list) {
                showings = list;
                renderShowings();
            },
            // one change - a new showing, new seats left, or a showing removed
            onEvent: function (event) {
                const s = event.showing;

                //NEW - a deleted showing is taken off the table, the other events add it or change its seats
                if (event.type === "ShowingDeleted") {
                    removeShowing(s);
                } else {
                    upsertShowing(s);
                }
                renderShowings();

                if (event.type === "ShowingCreated") {
                    document.getElementById("liveMessage").textContent =
                        "New showing added: " + s.movieTitle + " on " + formatDate(s.date) + " at " + s.time;
                } else if (event.type === "ShowingDeleted") {
                    document.getElementById("liveMessage").textContent =
                        "Showing removed: " + s.movieTitle + " on " + formatDate(s.date) + " at " + s.time;
                } else {
                    document.getElementById("liveMessage").textContent =
                        "Seats changed: " + s.movieTitle + " on " + formatDate(s.date) + " at " + s.time + " now has " + s.seats + " seats left";

                    // a booking was made, changed or cancelled for the showing whose bookings are open, so reload that table too
                    if (sameShowing(selectedShowing, s)) {
                        loadShowingBookings(selectedShowing);
                    }
                }
            },
            onStatus: function (text) {
                document.getElementById("liveStatus").textContent = text;
            }
        });
    </script>
</body>
</html>
