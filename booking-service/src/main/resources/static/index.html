<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Booking System</title>
    <style>
        .movie-block {
            margin-bottom: 30px;
        }
        .movie-block img {
            width: 120px;
            height: 160px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>
    <!-- who is logged in, with a log out button, filled in by showLoginBar() -->
    <p id="loginBar"></p>

    <h1>Now Showing at Free Cinemas</h1>

    <p>
        <a href="booking-client.html"><button>Book a Movie</button></a>
        <a href="update-booking.html"><button>Update My Booking</button></a>
        <a href="my-bookings.html"><button>My Bookings</button></a>
        <a id="adminLink" href="admin.html" style="display: none;"><button>Admin</button></a>
    </p>

    <!-- NEW - connection state of the live updates, and a note when a new showing appears -->
    <p>Live updates: <span id="liveStatus">connecting</span></p>
    <p id="liveMessage"></p>

    <div id="movies">Loading movies...</div>

    <script src="auth.js"></script>
    <script src="live.js"></script>
    <script>

        // not logged in goes straight to the login page
        requireLogin();
        showLoginBar();

        // only admins see the admin button, customers never do
        if (getRole() === "ADMIN") {
            document.getElementById("adminLink").style.display = "inline";
        }

        function formatDate(isoDate) {
            const [year, month, day] = isoDate.split("-");
            const monthNames = ["January", "February", "March", "April", "May", "June",
                                 "July", "August", "September", "October", "November", "December"];
            return parseInt(day) + " " + monthNames[parseInt(month) - 1];
        }

        // NEW - the page keeps the list of showings here, the live events change this list and the page is drawn again
        let showings = [];

        // NEW - the movies whose details are open, so drawing the page again does not close them
        const openTitles = new Set();

        const posterUrls = {
            "Inception": "https://upload.wikimedia.org/wikipedia/en/2/2e/Inception_%282010%29_theatrical_poster.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail_unscaled",
            "Dune": "https://thumb.wikimedia.org/wikipedia/en/thumb/8/8e/Dune_%282021_film%29.jpg/250px-Dune_%282021_film%29.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail",
            "The Grand Budapest Hotel": "https://upload.wikimedia.org/wikipedia/en/1/1c/The_Grand_Budapest_Hotel.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail_unscaled",
            "Parasite": "https://thumb.wikimedia.org/wikipedia/en/thumb/5/53/Parasite_%282019_film%29.png/250px-Parasite_%282019_film%29.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail",
            "Whiplash": "https://upload.wikimedia.org/wikipedia/en/0/01/Whiplash_poster.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail_unscaled"
        };

        // NEW - draws the whole list from the showings array
        // before this the page was drawn once, now it can be drawn again every time a live event arrives
        function render() {
            const moviesDiv = document.getElementById("movies");

            if (showings.length === 0) {
                moviesDiv.textContent = "No movies currently showing.";
                return;
            }

            const grouped = {};
            for (const showing of showings) {
                if (!grouped[showing.movieTitle]) {
                    grouped[showing.movieTitle] = {
                        genre: showing.genre,
                        description: showing.description,
                        runtime: showing.runtime,
                        times: []
                    };
                }
                grouped[showing.movieTitle].times.push(showing);
            }

            moviesDiv.innerHTML = "";

            for (const title in grouped) {
                const movie = grouped[title];

                // everything for one movie now lives inside its own
                // container, so it can't visually overlap the next movie
                const movieBlock = document.createElement("div");
                movieBlock.className = "movie-block";

                const poster = document.createElement("img");
                poster.src = posterUrls[title] || "https://placehold.co/120x160?text=" + encodeURIComponent(title);
                poster.alt = title;
                poster.style.cursor = "pointer";

                const titleButton = document.createElement("button");
                titleButton.textContent = title + " — click to view showtimes and details";

                const detailsDiv = document.createElement("div");
                detailsDiv.style.display = openTitles.has(title) ? "block" : "none";

                // textContent is used for the values so a title or description can never be read as html
                const genreLine = document.createElement("p");
                genreLine.textContent = movie.genre + " — " + movie.runtime + " min";
                const descriptionLine = document.createElement("p");
                descriptionLine.textContent = movie.description;
                const timesList = document.createElement("ul");

                for (const time of movie.times) {
                    const item = document.createElement("li");
                    item.textContent = formatDate(time.date) + " at " + time.time + " — " + time.seats + " seats left";
                    timesList.appendChild(item);
                }

                detailsDiv.appendChild(genreLine);
                detailsDiv.appendChild(descriptionLine);
                detailsDiv.appendChild(timesList);

                function toggleDetails() {
                    const nowOpen = detailsDiv.style.display === "none";
                    detailsDiv.style.display = nowOpen ? "block" : "none";
                    if (nowOpen) openTitles.add(title); else openTitles.delete(title);
                }

                poster.addEventListener("click", toggleDetails);
                titleButton.addEventListener("click", toggleDetails);

                movieBlock.appendChild(poster);
                movieBlock.appendChild(titleButton);
                movieBlock.appendChild(detailsDiv);

                moviesDiv.appendChild(movieBlock);
            }
        }

        // NEW - a showing is found by title + date + time, replace it if it is already in the list, otherwise add it
        function upsertShowing(updated) {
            const index = showings.findIndex(s =>
                s.movieTitle === updated.movieTitle && s.date === updated.date && s.time === updated.time);
            if (index >= 0) showings[index] = updated; else showings.push(updated);
        }

        // first draw straight from REST, so the page still works if the live connection cannot start
        // authFetch adds the login token to the request
        async function loadMovies() {
            try {
                const response = await authFetch("/api/v1/movies");
                showings = await response.json();
                render();
            } catch (err) {
                document.getElementById("movies").textContent = "Could not load movies.";
            }
        }

        loadMovies();

        // NEW - live updates, live.js connects to the websocket, fetches a snapshot and then calls these
        startLive({
            // the full current list - on connect and on every reconnect
            onSnapshot: function (list) {
                showings = list;
                render();
            },
            // one change - a new showing, or new seats left
            onEvent: function (event) {
                upsertShowing(event.showing);
                render();
                if (event.type === "ShowingCreated") {
                    const s = event.showing;
                    document.getElementById("liveMessage").textContent =
                        "New showing added: " + s.movieTitle + " on " + formatDate(s.date) + " at " + s.time;
                }
            },
            onStatus: function (text) {
                document.getElementById("liveStatus").textContent = text;
            }
        });
    </script>
</body>
</html>
