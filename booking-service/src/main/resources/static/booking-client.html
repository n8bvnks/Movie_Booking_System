<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book a Movie</title>
</head>
<body>
    <h1>Book a Movie</h1>
    <p><a href="index.html">Back to movies</a></p>

    <form id="bookingForm">
        <label for="name">Your name</label><br>
        <input type="text" id="name" required><br><br>

        <label for="movieTitle">Movie</label><br>
        <select id="movieTitle" required>
            <option value="">Select a movie</option>
        </select><br><br>

        <label for="date">Date</label><br>
        <select id="date" required>
            <option value="">Select a movie first</option>
        </select><br><br>

        <label for="timeslot">Time</label><br>
        <select id="timeslot" required>
            <option value="">Select a date first</option>
        </select><br><br>

        <label for="seats">Number of seats</label><br>
        <input type="number" id="seats" min="1" required><br><br>

        <button type="submit">Book Now</button>
    </form>

    <div id="result"></div>

    <script>
        let showingsData = [];

        // fetch every showing once, used to populate all three dropdowns
        async function loadMovieOptions() {
            try {
                const response = await fetch("/api/v1/movies");
                showingsData = await response.json();

                const movieSelect = document.getElementById("movieTitle");
                const uniqueTitles = [...new Set(showingsData.map(s => s.movieTitle))];

                for (const title of uniqueTitles) {
                    const option = document.createElement("option");
                    option.value = title;
                    option.textContent = title;
                    movieSelect.appendChild(option);
                }
            } catch (err) {
                document.getElementById("result").textContent = "Could not load movies.";
            }
        }

        // when a movie is chosen, fill the date dropdown with only the
        // dates that movie actually has a showing on
        document.getElementById("movieTitle").addEventListener("change", function () {
            const selectedTitle = this.value;

            const dateSelect = document.getElementById("date");
            dateSelect.innerHTML = '<option value="">Select a date</option>';

            const timeSelect = document.getElementById("timeslot");
            timeSelect.innerHTML = '<option value="">Select a date first</option>';

            if (!selectedTitle) return;

            const dates = [...new Set(
                showingsData
                    .filter(s => s.movieTitle === selectedTitle)
                    .map(s => s.date)
            )];

            for (const date of dates) {
                const option = document.createElement("option");
                option.value = date;
                option.textContent = date;
                dateSelect.appendChild(option);
            }
        });

        // when a date is chosen, fill the time dropdown with only the
        // times that specific movie+date combination is actually showing
        document.getElementById("date").addEventListener("change", function () {
            const selectedTitle = document.getElementById("movieTitle").value;
            const selectedDate = this.value;

            const timeSelect = document.getElementById("timeslot");
            timeSelect.innerHTML = '<option value="">Select a time</option>';

            if (!selectedDate) return;

            const times = showingsData
                .filter(s => s.movieTitle === selectedTitle && s.date === selectedDate)
                .map(s => s.time);

            for (const time of times) {
                const option = document.createElement("option");
                option.value = time;
                option.textContent = time;
                timeSelect.appendChild(option);
            }
        });

        document.getElementById("bookingForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const resultDiv = document.getElementById("result");
            resultDiv.textContent = "Booking...";

            const booking = {
                name: document.getElementById("name").value,
                movieTitle: document.getElementById("movieTitle").value,
                timeslot: document.getElementById("timeslot").value,
                date: document.getElementById("date").value,
                seats: Number(document.getElementById("seats").value)
            };

            try {
                const response = await fetch("/api/v1/bookings", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(booking)
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <p>Booking confirmed. Your booking ID is <strong>${data.bookingId}</strong>.</p>
                        <p>Save this ID to check your booking later.</p>
                    `;
                } else {
                    resultDiv.textContent = "Booking failed: " + data.message;
                }
            } catch (err) {
                resultDiv.textContent = "Something went wrong sending your booking.";
            }
        });

        loadMovieOptions();
    </script>
</body>
</html>
