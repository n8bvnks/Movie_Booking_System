spring.application.name=notification-service

# same shared RDS schema as the other two services, own table (notifications), same reasoning
# as movie-service and booking-service: one physical server, but no service ever queries or
# writes another service's table.
spring.datasource.url=jdbc:mysql://comp713-s2-2026.c5m2mi6uava2.ap-southeast-2.rds.amazonaws.com:3306/comp713_17988896
spring.datasource.username=c713_17988896
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=2

spring.jpa.hibernate.ddl-auto=update

server.port=${SERVER_PORT:8085}

management.endpoint.health.show-details=never

# connects to booking-service's embedded ActiveMQ broker as a remote client.
# booking-service must already be running (it hosts the broker) before this service can
# consume anything - see messaging/BrokerClientConfig.java for the redelivery policy.
spring.activemq.broker-url=tcp://${ACTIVEMQ_HOST:localhost}:${ACTIVEMQ_PORT:61616}
spring.activemq.user=
spring.activemq.password=
spring.jms.pub-sub-domain=false
